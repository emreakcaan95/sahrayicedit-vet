name: Android APK Derleme Sureci

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Kodu Getir
        uses: actions/checkout@v4

      - name: Node.js Kurulumu
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Java Kurulumu
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Web Dizinini ve Projeyi Hazirla
        run: |
          mkdir -p www
          cp index.html www/index.html
          npm init -y
          npm install --save @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "Sahrayicedit Vet" "com.sahrayicedit.veteriner" --web-dir "www"
          npx cap add android
          npx cap copy android
          
          # Android internet izni ekle
          sed -i '/<application/i <uses-permission android:name="android.permission.INTERNET" />' android/app/src/main/AndroidManifest.xml

      - name: APK Derle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: APK Dosyasini Yukle
        uses: actions/upload-artifact@v4
        with:
          name: Sahrayicedit-Veteriner-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
