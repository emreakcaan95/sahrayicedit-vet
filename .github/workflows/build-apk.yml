name: Android APK Derleme Sureci

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Kodu Getir
        uses: actions/checkout@v4

      - name: Java (JDK 17) Kurulumu
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Node.js Kurulumu
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Android Lisanslarini Onayla
        run: |
          yes | sdkmanager --licenses || true

      - name: Cordova ile Projeyi Olustur ve APK Derle
        run: |
          # Cordova'yi global olarak yukle
          npm install -g cordova

          # Cordova projesi baslat
          cordova create vetapp com.sahrayicedit.veteriner "Sahrayicedit Vet"
          cd vetapp

          # Orijinal index.html dosyasini Cordova www dizinine kopyala
          cp ../index.html www/index.html

          # Android platformunu ekle ve APK'yi derle
          cordova platform add android
          cordova build android --debug

      - name: APK Dosyasini Yukle
        uses: actions/upload-artifact@v4
        with:
          name: Sahrayicedit-Veteriner-Debug-APK
          path: vetapp/platforms/android/app/build/outputs/apk/debug/app-debug.apk
